<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="bv-title bv-desc">
  <title id="bv-title">Bias–variance trade-offs in rollout correction</title>
  <desc id="bv-desc">A two-panel academic diagram. Panel A shows how variance exposure typically increases from token to prefix to sequence ratios and identifies the minimum exact horizon for causal and response-level estimands. Panel B shows that raw importance sampling retains the full tail, truncated importance sampling caps it, masked importance sampling removes it, and pure rejection sampling is selection rather than change of measure.</desc>

  <defs>
    <marker id="trend-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b858f"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2878ad"/>
    </marker>
  </defs>

  <rect width="1440" height="840" fill="#f6f8fa"/>
  <rect x="34" y="34" width="1372" height="772" rx="10" fill="#ffffff" stroke="#d8dde2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="78" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="33">Bias–variance has two independent design axes</text>
    <text x="70" y="108" fill="#59636e" font-size="17">Ratio horizon determines exactness for a chosen estimand; the tail operator determines how much raw-weight dispersion remains.</text>

    <!-- Panel A -->
    <rect x="62" y="139" width="653" height="630" rx="8" fill="#fbfcfd" stroke="#d8dde2" stroke-width="1.5"/>
    <text x="84" y="173" fill="#2878ad" font-size="14" font-weight="700" letter-spacing="2">A · RATIO HORIZON</text>
    <text x="84" y="203" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="22">Longer products expose more weight dispersion</text>

    <!-- Panel A plot -->
    <g>
      <line x1="132" y1="433" x2="678" y2="433" stroke="#aeb6bf" stroke-width="1.5" marker-end="url(#trend-arrow)"/>
      <line x1="132" y1="433" x2="132" y2="238" stroke="#aeb6bf" stroke-width="1.5" marker-end="url(#trend-arrow)"/>
      <line x1="132" y1="371" x2="668" y2="371" stroke="#e4e7ea" stroke-width="1"/>
      <line x1="132" y1="309" x2="668" y2="309" stroke="#e4e7ea" stroke-width="1"/>
      <line x1="132" y1="247" x2="668" y2="247" stroke="#e4e7ea" stroke-width="1"/>

      <text x="97" y="340" transform="rotate(-90 97 340)" text-anchor="middle" fill="#59636e" font-size="13" font-weight="700" letter-spacing="1">VARIANCE EXPOSURE</text>
      <text x="405" y="477" text-anchor="middle" fill="#59636e" font-size="13" font-weight="700" letter-spacing="1">CORRECTION HORIZON</text>

      <path d="M188 405 C276 397 328 375 397 350 C493 315 548 270 626 249" fill="none" stroke="#2878ad" stroke-width="4"/>
      <circle cx="188" cy="405" r="8" fill="#ffffff" stroke="#2878ad" stroke-width="4"/>
      <circle cx="397" cy="350" r="8" fill="#ffffff" stroke="#2878ad" stroke-width="4"/>
      <circle cx="626" cy="249" r="8" fill="#ffffff" stroke="#2878ad" stroke-width="4"/>

      <text x="188" y="391" text-anchor="middle" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">r<tspan baseline-shift="sub" font-size="13">t</tspan></text>
      <text x="397" y="334" text-anchor="middle" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">R<tspan baseline-shift="sub" font-size="13">1:t</tspan></text>
      <text x="626" y="232" text-anchor="middle" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">R<tspan baseline-shift="sub" font-size="13">1:T</tspan></text>

      <text x="188" y="454" text-anchor="middle" fill="#35404a" font-size="13" font-weight="700">TOKEN</text>
      <text x="397" y="454" text-anchor="middle" fill="#35404a" font-size="13" font-weight="700">PREFIX</text>
      <text x="626" y="454" text-anchor="middle" fill="#35404a" font-size="13" font-weight="700">SEQUENCE</text>

      <rect x="451" y="263" width="165" height="43" rx="5" fill="#f4f9fc" stroke="#c7dce9"/>
      <text x="533" y="281" text-anchor="middle" fill="#2878ad" font-size="12" font-weight="700">DISPERSION ACCUMULATES</text>
      <text x="533" y="297" text-anchor="middle" fill="#59636e" font-size="11">as log-ratios are added</text>
    </g>

    <!-- Panel A exactness rows -->
    <text x="84" y="500" fill="#59636e" font-size="12" font-weight="700" letter-spacing="1.5">EXACTNESS FOR A FIXED ESTIMAND</text>
    <text x="304" y="523" text-anchor="middle" fill="#7b858f" font-size="11" font-weight="700" letter-spacing="1">TOKEN</text>
    <text x="456" y="523" text-anchor="middle" fill="#7b858f" font-size="11" font-weight="700" letter-spacing="1">PREFIX</text>
    <text x="613" y="523" text-anchor="middle" fill="#7b858f" font-size="11" font-weight="700" letter-spacing="1">SEQUENCE</text>

    <rect x="84" y="532" width="607" height="82" rx="6" fill="#ffffff" stroke="#d8dde2"/>
    <text x="100" y="555" fill="#17202a" font-size="14" font-weight="700">Causal term</text>
    <text x="100" y="576" fill="#59636e" font-family="Georgia, 'Times New Roman', serif" font-size="15">f<tspan baseline-shift="sub" font-size="11">t</tspan>(h<tspan baseline-shift="sub" font-size="11">t</tspan>, y<tspan baseline-shift="sub" font-size="11">t</tspan>)</text>
    <line x1="230" y1="532" x2="230" y2="614" stroke="#e4e7ea"/>
    <line x1="378" y1="532" x2="378" y2="614" stroke="#e4e7ea"/>
    <line x1="535" y1="532" x2="535" y2="614" stroke="#e4e7ea"/>
    <text x="304" y="558" text-anchor="middle" fill="#a53f3f" font-size="13" font-weight="700">OCCUPANCY BIAS</text>
    <text x="304" y="580" text-anchor="middle" fill="#59636e" font-size="12">prefix stays under μ</text>
    <rect x="390" y="544" width="133" height="48" rx="5" fill="#eaf4fa" stroke="#2878ad" stroke-width="1.5"/>
    <text x="456" y="563" text-anchor="middle" fill="#2878ad" font-size="12" font-weight="700">EXACT · MINIMAL</text>
    <text x="456" y="581" text-anchor="middle" fill="#59636e" font-size="11">future ratios integrate to 1</text>
    <text x="613" y="558" text-anchor="middle" fill="#2878ad" font-size="13" font-weight="700">EXACT</text>
    <text x="613" y="580" text-anchor="middle" fill="#59636e" font-size="12">extra weight dispersion</text>

    <rect x="84" y="625" width="607" height="82" rx="6" fill="#ffffff" stroke="#d8dde2"/>
    <text x="100" y="649" fill="#17202a" font-size="14" font-weight="700">Response term</text>
    <text x="100" y="671" fill="#59636e" font-family="Georgia, 'Times New Roman', serif" font-size="15">F(y<tspan baseline-shift="sub" font-size="11">1:T</tspan>)</text>
    <line x1="230" y1="625" x2="230" y2="707" stroke="#e4e7ea"/>
    <line x1="378" y1="625" x2="378" y2="707" stroke="#e4e7ea"/>
    <line x1="535" y1="625" x2="535" y2="707" stroke="#e4e7ea"/>
    <text x="304" y="652" text-anchor="middle" fill="#a53f3f" font-size="13" font-weight="700">NOT EXACT</text>
    <text x="304" y="674" text-anchor="middle" fill="#59636e" font-size="12">trajectory shift remains</text>
    <text x="456" y="652" text-anchor="middle" fill="#c66d0a" font-size="13" font-weight="700">NOT EXACT IF t &lt; T</text>
    <text x="456" y="674" text-anchor="middle" fill="#59636e" font-size="12">suffix still sampled from μ</text>
    <rect x="547" y="637" width="132" height="48" rx="5" fill="#eaf4fa" stroke="#2878ad" stroke-width="1.5"/>
    <text x="613" y="656" text-anchor="middle" fill="#2878ad" font-size="12" font-weight="700">EXACT · MINIMAL</text>
    <text x="613" y="674" text-anchor="middle" fill="#59636e" font-size="11">full change of measure</text>

    <text x="84" y="741" fill="#59636e" font-size="12">“Unbiased” is a property of estimator + estimand, not of a ratio name alone.</text>

    <!-- Panel B -->
    <rect x="730" y="139" width="648" height="630" rx="8" fill="#fbfcfd" stroke="#d8dde2" stroke-width="1.5"/>
    <text x="752" y="173" fill="#c66d0a" font-size="14" font-weight="700" letter-spacing="2">B · TAIL OPERATOR</text>
    <text x="752" y="203" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="22">Stability comes from departing from the raw tail</text>

    <!-- Panel B plot -->
    <g>
      <line x1="813" y1="570" x2="1341" y2="570" stroke="#aeb6bf" stroke-width="1.5" marker-end="url(#trend-arrow)"/>
      <line x1="813" y1="570" x2="813" y2="243" stroke="#aeb6bf" stroke-width="1.5" marker-end="url(#trend-arrow)"/>
      <line x1="813" y1="472" x2="1330" y2="472" stroke="#e4e7ea" stroke-width="1"/>
      <line x1="813" y1="374" x2="1330" y2="374" stroke="#e4e7ea" stroke-width="1"/>
      <line x1="813" y1="276" x2="1330" y2="276" stroke="#e4e7ea" stroke-width="1"/>

      <text x="776" y="407" transform="rotate(-90 776 407)" text-anchor="middle" fill="#59636e" font-size="13" font-weight="700" letter-spacing="1">TAIL VARIANCE RETAINED</text>
      <text x="1078" y="607" text-anchor="middle" fill="#59636e" font-size="12" font-weight="700" letter-spacing="0.8">DEPARTURE FROM RAW CHANGE OF MEASURE / BIAS RISK</text>

      <path d="M873 285 C975 329 1090 421 1209 500" fill="none" stroke="#7b858f" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#trend-arrow)"/>

      <circle cx="873" cy="285" r="12" fill="#2878ad" stroke="#ffffff" stroke-width="4"/>
      <text x="897" y="267" fill="#2878ad" font-size="15" font-weight="700">IS</text>
      <text x="897" y="288" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="17">w(R) = R</text>
      <text x="897" y="307" fill="#59636e" font-size="12">full tail · zero operator bias</text>

      <circle cx="1048" cy="386" r="12" fill="#c66d0a" stroke="#ffffff" stroke-width="4"/>
      <text x="1072" y="367" fill="#c66d0a" font-size="15" font-weight="700">TIS</text>
      <text x="1072" y="389" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="17">w(R) = min(R, C)</text>
      <text x="1072" y="408" fill="#59636e" font-size="12">tail capped · sample retained</text>

      <circle cx="1209" cy="500" r="12" fill="#a53f3f" stroke="#ffffff" stroke-width="4"/>
      <text x="1233" y="481" fill="#a53f3f" font-size="15" font-weight="700">MIS</text>
      <text x="1233" y="503" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="17">w(R) = I[R ≤ C] R</text>
      <text x="1233" y="522" fill="#59636e" font-size="12">tail omitted · lower utilization</text>
    </g>

    <!-- RS note -->
    <rect x="774" y="631" width="560" height="73" rx="7" fill="#f4faf7" stroke="#19845d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="801" cy="657" r="8" fill="#19845d"/>
    <text x="820" y="654" fill="#19845d" font-size="13" font-weight="700">PURE RS IS OFF THE IS CURVE</text>
    <text x="820" y="678" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="17">I[S ∈ A] × base contribution</text>
    <text x="1125" y="678" fill="#59636e" font-size="12">selection, not change of measure by itself</text>

    <text x="752" y="741" fill="#59636e" font-size="12">Schematic only: realized bias is signed and depends on F, thresholds, and correlation with the ratio tail.</text>
  </g>
</svg>
