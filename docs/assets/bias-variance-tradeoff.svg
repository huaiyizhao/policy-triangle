<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="bv-title bv-desc">
  <title id="bv-title">Bias versus variance for rollout-correction estimators</title>
  <desc id="bv-desc">A schematic bias-variance map relative to the unclipped q-surrogate with aligned q-policy advantage. Prefix importance sampling and sequence importance sampling lie near the zero-bias boundary, with sequence importance sampling having higher variance. Token importance sampling has lower variance but occupancy bias. Truncation, masking, and geometric rejection move estimators toward lower variance and higher bias. Positions are qualitative and depend on thresholds, response length, and correlation with the ratio tail.</desc>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b858f"/>
    </marker>
  </defs>

  <rect width="1440" height="850" fill="#f6f8fa"/>
  <rect x="34" y="34" width="1372" height="782" rx="12" fill="#ffffff" stroke="#d8dde2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="82" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="34">Bias–variance trade-offs relative to the q-surrogate</text>
    <text x="72" y="116" fill="#59636e" font-size="16">Lower-left is preferable; every position is schematic rather than a measured numerical ranking.</text>

    <!-- Operator legend -->
    <g transform="translate(865 72)">
      <circle cx="8" cy="8" r="7" fill="#2878ad"/>
      <text x="22" y="13" fill="#205f8b" font-size="13" font-weight="700">RAW IS</text>
      <circle cx="108" cy="8" r="7" fill="#c66d0a"/>
      <text x="122" y="13" fill="#8f4c05" font-size="13" font-weight="700">TIS</text>
      <circle cx="190" cy="8" r="7" fill="#a53f3f"/>
      <text x="204" y="13" fill="#8d3232" font-size="13" font-weight="700">MIS</text>
      <circle cx="280" cy="8" r="7" fill="#19845d"/>
      <text x="294" y="13" fill="#126746" font-size="13" font-weight="700">RS / GEO-RS</text>
    </g>

    <!-- Plot field -->
    <rect x="154" y="162" width="1134" height="535" rx="8" fill="#fbfcfd" stroke="#d8dde2" stroke-width="1.5"/>

    <!-- Grid -->
    <line x1="170" y1="590" x2="1270" y2="590" stroke="#e5e8eb"/>
    <line x1="170" y1="485" x2="1270" y2="485" stroke="#e5e8eb"/>
    <line x1="170" y1="380" x2="1270" y2="380" stroke="#e5e8eb"/>
    <line x1="170" y1="275" x2="1270" y2="275" stroke="#e5e8eb"/>
    <line x1="380" y1="180" x2="380" y2="680" stroke="#eef0f2"/>
    <line x1="600" y1="180" x2="600" y2="680" stroke="#eef0f2"/>
    <line x1="820" y1="180" x2="820" y2="680" stroke="#eef0f2"/>
    <line x1="1040" y1="180" x2="1040" y2="680" stroke="#eef0f2"/>

    <!-- Axes -->
    <line x1="170" y1="680" x2="1274" y2="680" stroke="#7b858f" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <line x1="170" y1="680" x2="170" y2="177" stroke="#7b858f" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="720" y="726" text-anchor="middle" fill="#35404a" font-size="14" font-weight="700" letter-spacing="1.2">BIAS RELATIVE TO THE q-SURROGATE</text>
    <text x="170" y="710" fill="#59636e" font-size="12" font-weight="700">LOW</text>
    <text x="1248" y="710" text-anchor="end" fill="#59636e" font-size="12" font-weight="700">HIGH</text>
    <text x="104" y="430" transform="rotate(-90 104 430)" text-anchor="middle" fill="#35404a" font-size="14" font-weight="700" letter-spacing="1.2">VARIANCE</text>
    <text x="142" y="674" text-anchor="end" fill="#59636e" font-size="12" font-weight="700">LOW</text>
    <text x="142" y="190" text-anchor="end" fill="#59636e" font-size="12" font-weight="700">HIGH</text>

    <!-- Reference regions -->
    <rect x="187" y="184" width="84" height="478" rx="8" fill="#eaf4fa" opacity="0.58" stroke="#2878ad" stroke-dasharray="5 5"/>
    <text x="229" y="205" text-anchor="middle" fill="#2878ad" font-size="10" font-weight="700" letter-spacing="0.8">ZERO-BIAS</text>
    <text x="229" y="220" text-anchor="middle" fill="#2878ad" font-size="10" font-weight="700" letter-spacing="0.8">BOUNDARY*</text>

    <ellipse cx="274" cy="625" rx="86" ry="42" fill="#eaf6f1" stroke="#19845d" stroke-dasharray="6 5"/>
    <text x="274" y="620" text-anchor="middle" fill="#126746" font-size="12" font-weight="700">DESIRABLE REGION</text>
    <text x="274" y="638" text-anchor="middle" fill="#59636e" font-size="11">low bias · low variance</text>

    <!-- Trade-off arrows -->
    <path d="M247 244 C350 270 432 326 511 391 C608 466 689 510 782 542" fill="none" stroke="#7b858f" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
    <text x="548" y="310" transform="rotate(31 548 310)" text-anchor="middle" fill="#59636e" font-size="11" font-weight="700">STRONGER SEQUENCE TAIL CONTROL</text>

    <path d="M247 371 C331 401 397 452 468 505" fill="none" stroke="#7b858f" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
    <path d="M430 574 C508 598 563 619 630 635" fill="none" stroke="#7b858f" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>

    <!-- Raw IS family -->
    <circle cx="229" cy="242" r="12" fill="#2878ad" stroke="#ffffff" stroke-width="4"/>
    <text x="253" y="235" fill="#205f8b" font-size="15" font-weight="700">Seq-IS</text>
    <text x="253" y="253" fill="#59636e" font-size="11">zero bias · highest variance</text>

    <circle cx="229" cy="370" r="12" fill="#2878ad" stroke="#ffffff" stroke-width="4"/>
    <text x="253" y="363" fill="#205f8b" font-size="15" font-weight="700">Prefix-IS</text>
    <text x="253" y="381" fill="#59636e" font-size="11">zero bias · fewer ratios</text>

    <circle cx="420" cy="573" r="12" fill="#2878ad" stroke="#ffffff" stroke-width="4"/>
    <text x="444" y="566" fill="#205f8b" font-size="15" font-weight="700">Token-IS</text>
    <text x="444" y="584" fill="#59636e" font-size="11">low variance · occupancy bias</text>

    <!-- TIS family -->
    <circle cx="510" cy="391" r="12" fill="#c66d0a" stroke="#ffffff" stroke-width="4"/>
    <text x="534" y="384" fill="#8f4c05" font-size="15" font-weight="700">Seq-TIS</text>
    <text x="534" y="402" fill="#59636e" font-size="11">tail capped · sample retained</text>

    <circle cx="468" cy="505" r="12" fill="#c66d0a" stroke="#ffffff" stroke-width="4"/>
    <text x="492" y="498" fill="#8f4c05" font-size="15" font-weight="700">Prefix-TIS</text>
    <text x="492" y="516" fill="#59636e" font-size="11">less dispersion · truncation bias</text>

    <circle cx="640" cy="635" r="12" fill="#c66d0a" stroke="#ffffff" stroke-width="4"/>
    <text x="664" y="628" fill="#8f4c05" font-size="15" font-weight="700">Token-TIS</text>
    <text x="664" y="646" fill="#59636e" font-size="11">most local · two bias sources</text>

    <!-- MIS -->
    <circle cx="790" cy="542" r="12" fill="#a53f3f" stroke="#ffffff" stroke-width="4"/>
    <text x="814" y="535" fill="#8d3232" font-size="15" font-weight="700">Seq-MIS</text>
    <text x="814" y="553" fill="#59636e" font-size="11">tail omitted · lower utilization</text>

    <!-- Geometric selection family -->
    <ellipse cx="1050" cy="585" rx="175" ry="86" fill="#eaf6f1" opacity="0.62" stroke="#19845d" stroke-width="1.7" stroke-dasharray="7 5"/>
    <text x="1050" y="526" text-anchor="middle" fill="#126746" font-size="11" font-weight="700" letter-spacing="1.1">SELECTION FAMILY · THRESHOLD-DEPENDENT</text>

    <circle cx="985" cy="574" r="12" fill="#19845d" stroke="#ffffff" stroke-width="4"/>
    <text x="1009" y="568" fill="#126746" font-size="15" font-weight="700">Geo-RS</text>
    <text x="1009" y="586" fill="#59636e" font-size="11">length-normalized gate</text>

    <circle cx="1118" cy="632" r="12" fill="#19845d" stroke="#ffffff" stroke-width="4"/>
    <text x="1142" y="626" fill="#126746" font-size="14" font-weight="700">Geo-RS + Token-TIS</text>
    <text x="1142" y="644" fill="#59636e" font-size="11">gate + local capped weight</text>

    <!-- Reading notes -->
    <text x="72" y="770" fill="#35404a" font-size="12" font-weight="700">* Reference estimand: the unclipped q-surrogate with correctly aligned A<tspan baseline-shift="super" font-size="9">q</tspan>.</text>
    <text x="72" y="793" fill="#59636e" font-size="12">Thresholds, response length, credit error, tail correlation, and effective sample size can move every non-exact estimator; arrows show the intended qualitative trade-off only.</text>
  </g>
</svg>
