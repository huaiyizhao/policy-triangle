<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" role="img" aria-labelledby="intro-title intro-desc">
  <title id="intro-title">A unified estimator view of policy-mismatch mitigation</title>
  <desc id="intro-desc">An academic graphical abstract centered on a unified gradient estimator. Behavior policy mu generates data, q anchors the proximal surrogate, and pi is trainable. Colored slots show the statistic and mask, behavior weight, update and credit term, and policy score. Existing methods are configurations of these slots.</desc>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#d8dde2" opacity="0.48"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2878ad"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#19845d"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b858f"/>
    </marker>
  </defs>

  <rect width="1440" height="880" fill="#f7f8fa"/>
  <rect width="1440" height="880" fill="url(#grid)"/>
  <rect x="34" y="34" width="1372" height="812" rx="14" fill="#ffffff" stroke="#d8dde2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="78" fill="#59636e" font-size="14" font-weight="700" letter-spacing="2.5">GRAPHICAL ABSTRACT</text>
    <text x="72" y="119" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="34">Policy-mismatch mitigation as estimator design</text>
    <text x="1368" y="116" text-anchor="end" fill="#7b858f" font-size="14">target first · slots second · method name last</text>
    <line x1="72" y1="143" x2="1368" y2="143" stroke="#d8dde2" stroke-width="2"/>

    <g transform="translate(190 169)">
      <rect width="1060" height="126" rx="10" fill="#f8fafb" stroke="#d8dde2" stroke-width="1.5"/>

      <g transform="translate(36 28)">
        <rect width="222" height="70" rx="9" fill="#eef6fb" stroke="#2878ad" stroke-width="2"/>
        <circle cx="35" cy="35" r="20" fill="#2878ad"/>
        <text x="35" y="43" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="25">μ</text>
        <text x="70" y="30" fill="#17202a" font-size="17" font-weight="700">behavior policy</text>
        <text x="70" y="51" fill="#59636e" font-size="13">generates rollouts + credit</text>
      </g>

      <line x1="275" y1="63" x2="407" y2="63" stroke="#2878ad" stroke-width="3" marker-end="url(#arrow-blue)"/>
      <rect x="297" y="37" width="88" height="24" rx="12" fill="#ffffff"/>
      <text x="341" y="54" text-anchor="middle" fill="#205f8b" font-family="Georgia, 'Times New Roman', serif" font-size="16">B = q / μ</text>

      <g transform="translate(422 28)">
        <rect width="222" height="70" rx="9" fill="#fff7ee" stroke="#c66d0a" stroke-width="2"/>
        <circle cx="35" cy="35" r="20" fill="#c66d0a"/>
        <text x="35" y="43" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="25">q</text>
        <text x="70" y="30" fill="#17202a" font-size="17" font-weight="700">proximal anchor</text>
        <text x="70" y="51" fill="#59636e" font-size="13">defines the local surrogate</text>
      </g>

      <line x1="661" y1="63" x2="793" y2="63" stroke="#19845d" stroke-width="3" marker-end="url(#arrow-green)"/>
      <rect x="683" y="37" width="88" height="24" rx="12" fill="#ffffff"/>
      <text x="727" y="54" text-anchor="middle" fill="#126746" font-family="Georgia, 'Times New Roman', serif" font-size="16">U = π / q</text>

      <g transform="translate(808 28)">
        <rect width="216" height="70" rx="9" fill="#eef8f4" stroke="#19845d" stroke-width="2"/>
        <circle cx="35" cy="35" r="20" fill="#19845d"/>
        <text x="35" y="43" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="24">π</text>
        <text x="70" y="30" fill="#17202a" font-size="17" font-weight="700">current policy</text>
        <text x="70" y="51" fill="#59636e" font-size="13">receives the gradient</text>
      </g>

      <path d="M147 22 C330 -14 700 -14 916 22" fill="none" stroke="#7b858f" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
      <rect x="484" y="-2" width="116" height="25" rx="12.5" fill="#ffffff" stroke="#d8dde2"/>
      <text x="542" y="16" text-anchor="middle" fill="#59636e" font-family="Georgia, 'Times New Roman', serif" font-size="15">E = π / μ = BU</text>
    </g>

    <g transform="translate(72 325)">
      <rect width="1296" height="186" rx="12" fill="#17202a"/>
      <text x="24" y="31" fill="#aeb9c3" font-size="12" font-weight="700" letter-spacing="2">ONE REFERENCE TEMPLATE</text>
      <text x="648" y="89" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="37">
        ĝ = Σ<tspan baseline-shift="sub" font-size="22">t</tspan>
        <tspan dx="8">E</tspan><tspan baseline-shift="sub" font-size="20" fill="#80b9de">y∼μ</tspan>
        <tspan baseline-shift="baseline" font-size="37" fill="#ffffff"> [ </tspan>
        <tspan fill="#80b9de">M(S)</tspan>
        <tspan fill="#ffffff"> · </tspan>
        <tspan fill="#e5a960">W̃(B)</tspan>
        <tspan fill="#ffffff"> · </tspan>
        <tspan fill="#bda7df">Ψ̃(U, Â)</tspan>
        <tspan fill="#ffffff"> · </tspan>
        <tspan fill="#79c5aa">s</tspan><tspan baseline-shift="sub" font-size="22" fill="#79c5aa">t</tspan>
        <tspan baseline-shift="baseline" font-size="37" fill="#ffffff"> ]</tspan>
      </text>
      <line x1="164" y1="115" x2="1132" y2="115" stroke="#40515d"/>
      <text x="648" y="146" text-anchor="middle" fill="#c7d0d7" font-size="15">Every method below chooses what each colored slot means; identity is also a choice.</text>
      <text x="648" y="169" text-anchor="middle" fill="#8fa0ac" font-size="12">The template organizes estimators of the local q-surrogate—it does not assert that every configuration is exact.</text>
    </g>

    <g transform="translate(72 537)">
      <g>
        <rect width="300" height="196" rx="10" fill="#f4f9fc" stroke="#2878ad" stroke-width="2"/>
        <rect width="300" height="7" rx="3.5" fill="#2878ad"/>
        <text x="20" y="39" fill="#2878ad" font-size="13" font-weight="700" letter-spacing="1.5">M(S) · OBSERVE + ADMIT</text>
        <path d="M21 58 H67 L51 78 V98 L37 105 V78 Z" fill="none" stroke="#2878ad" stroke-width="2.5" stroke-linejoin="round"/>
        <text x="82" y="73" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">Which mismatch?</text>
        <text x="82" y="96" fill="#59636e" font-size="13">Which samples remain?</text>
        <line x1="20" y1="119" x2="280" y2="119" stroke="#c7dce9"/>
        <text x="20" y="145" fill="#35404a" font-size="14">token · prefix · sequence · KL</text>
        <text x="20" y="170" fill="#205f8b" font-size="13" font-weight="700">RS · Geo-RS · MIS mask</text>
      </g>

      <g transform="translate(332 0)">
        <rect width="300" height="196" rx="10" fill="#fff9f2" stroke="#c66d0a" stroke-width="2"/>
        <rect width="300" height="7" rx="3.5" fill="#c66d0a"/>
        <text x="20" y="39" fill="#c66d0a" font-size="13" font-weight="700" letter-spacing="1.5">W̃(B) · REWEIGHT DATA</text>
        <g transform="translate(20 56)">
          <line x1="0" y1="48" x2="48" y2="48" stroke="#aeb6bf"/>
          <line x1="0" y1="48" x2="0" y2="0" stroke="#aeb6bf"/>
          <path d="M0 48 L43 6" fill="none" stroke="#c66d0a" stroke-width="3"/>
        </g>
        <text x="82" y="73" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">How much influence?</text>
        <text x="82" y="96" fill="#59636e" font-size="13">Detached change of measure</text>
        <line x1="20" y1="119" x2="280" y2="119" stroke="#ecd6bc"/>
        <text x="20" y="145" fill="#35404a" font-size="14">raw · capped · tapered · normalized</text>
        <text x="20" y="170" fill="#8f4c05" font-size="13" font-weight="700">IS · TIS · accepted MIS weight</text>
      </g>

      <g transform="translate(664 0)">
        <rect width="300" height="196" rx="10" fill="#f8f5fc" stroke="#6947a4" stroke-width="2"/>
        <rect width="300" height="7" rx="3.5" fill="#6947a4"/>
        <text x="20" y="39" fill="#6947a4" font-size="13" font-weight="700" letter-spacing="1.5">Ψ̃(U, Â) · UPDATE + CREDIT</text>
        <path d="M20 98 C38 98 38 58 55 58 C72 58 72 98 92 98" fill="none" stroke="#6947a4" stroke-width="3"/>
        <text x="108" y="73" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">How to update?</text>
        <text x="108" y="96" fill="#59636e" font-size="13">Who supplies credit?</text>
        <line x1="20" y1="119" x2="280" y2="119" stroke="#d8cfe8"/>
        <text x="20" y="145" fill="#35404a" font-size="14">unclipped · PPO · GSPO</text>
        <text x="20" y="170" fill="#553587" font-size="13" font-weight="700">Â rollout · A<tspan baseline-shift="super" font-size="9">q</tspan> · realigned credit</text>
      </g>

      <g transform="translate(996 0)">
        <rect width="300" height="196" rx="10" fill="#f4faf7" stroke="#19845d" stroke-width="2"/>
        <rect width="300" height="7" rx="3.5" fill="#19845d"/>
        <text x="20" y="39" fill="#19845d" font-size="13" font-weight="700" letter-spacing="1.5">s<tspan baseline-shift="sub" font-size="9">t</tspan> · TRAINABLE SCORE</text>
        <circle cx="48" cy="80" r="24" fill="none" stroke="#19845d" stroke-width="2.5"/>
        <path d="M38 80 H58 M52 73 L59 80 L52 87" fill="none" stroke="#19845d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="82" y="73" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">Where does it learn?</text>
        <text x="82" y="96" fill="#59636e" font-size="13">score of current π<tspan baseline-shift="sub" font-size="9">θ</tspan></text>
        <line x1="20" y1="119" x2="280" y2="119" stroke="#c9e1d8"/>
        <text x="20" y="145" fill="#35404a" font-size="14">∇<tspan baseline-shift="sub" font-size="10">θ</tspan> log π<tspan baseline-shift="sub" font-size="10">θ</tspan>(y<tspan baseline-shift="sub" font-size="10">t</tspan> | h<tspan baseline-shift="sub" font-size="10">t</tspan>)</text>
        <text x="20" y="170" fill="#126746" font-size="13" font-weight="700">π<tspan baseline-shift="sub" font-size="9">θ</tspan> is the only trainable policy</text>
      </g>
    </g>

    <g transform="translate(72 759)">
      <rect width="1296" height="57" rx="7" fill="#f8fafb" stroke="#aeb6bf" stroke-width="1.5"/>
      <text x="20" y="23" fill="#59636e" font-size="11" font-weight="700" letter-spacing="1.5">METHODS ARE CONFIGURATIONS OF THE SLOTS</text>
      <text x="20" y="44" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="17">PPO · IS · TIS · MIS · RS · Geo-RS · IcePop · KPop · GSPO</text>
      <text x="1274" y="35" text-anchor="end" fill="#59636e" font-size="13">Choose from the target and failure mode—not from a context-free ranking.</text>
    </g>
  </g>
</svg>
