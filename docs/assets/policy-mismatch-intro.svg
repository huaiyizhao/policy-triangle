<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="intro-title intro-desc">
  <title id="intro-title">From exact policy gradient to the decoupled policy-mismatch solution space</title>
  <desc id="intro-desc">An academic graphical abstract. The exact off-policy policy gradient is localized into a q-surrogate by TRPO and PPO, then Decoupled PPO separates behavior correction B, credit realignment toward A q, and proximal update U. Existing LLM methods densely explore B and U, while explicit advantage realignment remains comparatively underexplored. Coupled bypass is the special case q equals mu.</desc>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.25" fill="#d8dde2" opacity="0.55"/>
    </pattern>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b858f"/>
    </marker>
  </defs>

  <rect width="1440" height="860" fill="#f7f8fa"/>
  <rect width="1440" height="860" fill="url(#grid)"/>
  <rect x="34" y="34" width="1372" height="792" rx="14" fill="#ffffff" stroke="#d8dde2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="78" fill="#59636e" font-size="14" font-weight="700" letter-spacing="2.5">GRAPHICAL ABSTRACT</text>
    <text x="72" y="119" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="34">Policy-mismatch mitigation as approximation of a local surrogate</text>

    <g transform="translate(1095 72)">
      <circle cx="7" cy="7" r="6" fill="#2878ad"/>
      <text x="20" y="12" fill="#2878ad" font-size="13" font-weight="700">μ behavior</text>
      <circle cx="112" cy="7" r="6" fill="#c66d0a"/>
      <text x="125" y="12" fill="#c66d0a" font-size="13" font-weight="700">q proximal</text>
      <circle cx="225" cy="7" r="6" fill="#19845d"/>
      <text x="238" y="12" fill="#19845d" font-size="13" font-weight="700">π current</text>
    </g>

    <line x1="72" y1="143" x2="1368" y2="143" stroke="#d8dde2" stroke-width="2"/>

    <!-- Evolution from the exact benchmark to the local surrogate -->
    <g transform="translate(72 174)">
      <rect width="386" height="178" rx="9" fill="#f8fafb" stroke="#aeb6bf" stroke-width="1.7"/>
      <text x="22" y="29" fill="#59636e" font-size="12" font-weight="700" letter-spacing="1.7">EXACT OFF-POLICY PG</text>
      <line x1="22" y1="41" x2="364" y2="41" stroke="#d8dde2"/>
      <text x="193" y="82" text-anchor="middle" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="25">
        E<tspan baseline-shift="sub" font-size="15">1:t</tspan><tspan fill="#59636e">(</tspan><tspan fill="#19845d">π</tspan><tspan fill="#59636e">/</tspan><tspan fill="#2878ad">μ</tspan><tspan fill="#59636e">)</tspan>
        <tspan fill="#59636e"> · </tspan>A<tspan baseline-shift="super" font-size="15" fill="#19845d">π</tspan>
        <tspan fill="#59636e"> · ∇ log </tspan><tspan fill="#19845d">π</tspan>
      </text>
      <text x="22" y="121" fill="#35404a" font-size="14">Exact change of measure to the current policy</text>
      <text x="22" y="149" fill="#a53f3f" font-size="13" font-weight="700">Obstacle 1 · high-variance prefix product</text>
      <text x="22" y="169" fill="#a53f3f" font-size="13" font-weight="700">Obstacle 2 · current-policy credit A<tspan baseline-shift="super" font-size="9">π</tspan></text>
    </g>

    <path d="M469 261 L505 261" fill="none" stroke="#7b858f" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
    <text x="487" y="246" text-anchor="middle" fill="#7b858f" font-size="10" font-weight="700">LOCALIZE</text>

    <g transform="translate(520 174)">
      <rect width="386" height="178" rx="9" fill="#fffaf4" stroke="#c66d0a" stroke-width="1.7"/>
      <text x="22" y="29" fill="#c66d0a" font-size="12" font-weight="700" letter-spacing="1.7">TRPO / PPO LOCAL q-SURROGATE</text>
      <line x1="22" y1="41" x2="364" y2="41" stroke="#ecd6bc"/>
      <text x="193" y="78" text-anchor="middle" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="24">
        d<tspan baseline-shift="super" font-size="15" fill="#19845d">π</tspan>
        <tspan fill="#59636e"> ≈ d</tspan><tspan baseline-shift="super" font-size="15" fill="#c66d0a">q</tspan>
        <tspan fill="#59636e">,   credit = A</tspan><tspan baseline-shift="super" font-size="15" fill="#c66d0a">q</tspan>
      </text>
      <text x="22" y="117" fill="#35404a" font-size="14">A first-order model accurate around frozen q</text>
      <rect x="22" y="136" width="155" height="27" rx="13.5" fill="#fff3e3" stroke="#c66d0a"/>
      <text x="99.5" y="154" text-anchor="middle" fill="#8f4c05" font-size="12" font-weight="700">TRPO · constrain U</text>
      <rect x="193" y="136" width="171" height="27" rx="13.5" fill="#eef8f4" stroke="#19845d"/>
      <text x="278.5" y="154" text-anchor="middle" fill="#126746" font-size="12" font-weight="700">PPO · clipped shaper</text>
    </g>

    <path d="M917 261 L953 261" fill="none" stroke="#7b858f" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
    <text x="935" y="246" text-anchor="middle" fill="#7b858f" font-size="10" font-weight="700">DECOUPLE</text>

    <g transform="translate(968 174)">
      <rect width="400" height="178" rx="9" fill="#f7f5fb" stroke="#6947a4" stroke-width="2.2"/>
      <text x="22" y="29" fill="#6947a4" font-size="12" font-weight="700" letter-spacing="1.7">DECOUPLED PPO REFERENCE</text>
      <line x1="22" y1="41" x2="378" y2="41" stroke="#d8cfe8"/>
      <text x="200" y="84" text-anchor="middle" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="25">
        <tspan fill="#2878ad">B</tspan><tspan baseline-shift="sub" font-size="15" fill="#2878ad">1:t</tspan>
        <tspan fill="#59636e"> · </tspan>A<tspan baseline-shift="super" font-size="15" fill="#c66d0a">q</tspan>
        <tspan fill="#59636e"> · </tspan><tspan fill="#19845d">U</tspan><tspan baseline-shift="sub" font-size="15" fill="#19845d">t</tspan>
        <tspan fill="#59636e"> · ∇ log </tspan><tspan fill="#19845d">π</tspan><tspan baseline-shift="sub" font-size="15" fill="#19845d">θ</tspan>
      </text>
      <text x="200" y="112" text-anchor="middle" fill="#59636e" font-size="13">estimated with y ∼ <tspan fill="#2878ad" font-weight="700">μ</tspan></text>
      <g transform="translate(22 132)">
        <rect width="108" height="29" rx="5" fill="#eef6fb" stroke="#2878ad"/>
        <text x="54" y="19" text-anchor="middle" fill="#205f8b" font-size="11" font-weight="700">PAST · B</text>
        <rect x="124" width="108" height="29" rx="5" fill="#fff7ee" stroke="#c66d0a"/>
        <text x="178" y="19" text-anchor="middle" fill="#8f4c05" font-size="11" font-weight="700">CREDIT · A<tspan baseline-shift="super" font-size="8">q</tspan></text>
        <rect x="248" width="108" height="29" rx="5" fill="#eef8f4" stroke="#19845d"/>
        <text x="302" y="19" text-anchor="middle" fill="#126746" font-size="11" font-weight="700">UPDATE · U</text>
      </g>
    </g>

    <!-- Three approximation surfaces -->
    <text x="72" y="397" fill="#59636e" font-size="12" font-weight="700" letter-spacing="2.2">THREE APPROXIMATION SURFACES</text>
    <line x1="348" y1="392" x2="1368" y2="392" stroke="#d8dde2"/>

    <g transform="translate(72 421)">
      <rect width="400" height="276" rx="10" fill="#f7fbfd" stroke="#2878ad" stroke-width="2"/>
      <rect width="400" height="8" rx="4" fill="#2878ad"/>
      <text x="22" y="42" fill="#2878ad" font-size="12" font-weight="700" letter-spacing="1.6">B · BEHAVIOR CORRECTION</text>
      <text x="22" y="82" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="28">
        <tspan fill="#2878ad">μ</tspan><tspan fill="#59636e">  →  </tspan><tspan fill="#c66d0a">q</tspan>
        <tspan dx="15" fill="#59636e" font-size="21">B = </tspan><tspan fill="#c66d0a" font-size="21">q</tspan><tspan fill="#59636e" font-size="21">/</tspan><tspan fill="#2878ad" font-size="21">μ</tspan>
      </text>
      <text x="22" y="113" fill="#35404a" font-size="14">Past contexts and sampled actions</text>
      <line x1="22" y1="132" x2="378" y2="132" stroke="#c8ddea"/>
      <text x="22" y="160" fill="#59636e" font-size="12" font-weight="700" letter-spacing="1.2">OPERATORS</text>
      <text x="22" y="185" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">mask · detached weight</text>
      <text x="22" y="218" fill="#59636e" font-size="12" font-weight="700" letter-spacing="1.2">MAPPED METHODS</text>
      <text x="22" y="244" fill="#17202a" font-size="14">IS · TIS · MIS · RS · IcePop · KPop</text>
      <rect x="264" y="223" width="114" height="31" rx="15.5" fill="#e5f2fa" stroke="#2878ad"/>
      <text x="321" y="243" text-anchor="middle" fill="#205f8b" font-size="11" font-weight="700">DENSELY EXPLORED</text>
    </g>

    <g transform="translate(520 421)">
      <rect width="400" height="276" rx="10" fill="#fbf9fd" stroke="#6947a4" stroke-width="2"/>
      <rect width="400" height="8" rx="4" fill="#6947a4"/>
      <text x="22" y="42" fill="#6947a4" font-size="12" font-weight="700" letter-spacing="1.6">A · CREDIT REALIGNMENT</text>
      <text x="22" y="82" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="28">
        Â<tspan baseline-shift="sub" font-size="16" fill="#2878ad">roll</tspan>
        <tspan fill="#59636e">  ⇢  A</tspan><tspan baseline-shift="super" font-size="16" fill="#c66d0a">q</tspan>
      </text>
      <text x="22" y="113" fill="#35404a" font-size="14">Future continuation under the proximal policy</text>
      <line x1="22" y1="132" x2="378" y2="132" stroke="#d8cfe8"/>
      <text x="22" y="160" fill="#59636e" font-size="12" font-weight="700" letter-spacing="1.2">POSSIBLE ESTIMATORS</text>
      <text x="22" y="185" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="18">q-critic · suffix IS · traces · re-rolls</text>
      <text x="22" y="218" fill="#59636e" font-size="12" font-weight="700" letter-spacing="1.2">CURRENT PRACTICE</text>
      <text x="22" y="244" fill="#17202a" font-size="14">Usually assumes Â<tspan baseline-shift="sub" font-size="10">roll</tspan> ≈ A<tspan baseline-shift="super" font-size="10">q</tspan></text>
      <rect x="211" y="223" width="167" height="31" rx="15.5" fill="#f0ebf7" stroke="#6947a4"/>
      <text x="294.5" y="243" text-anchor="middle" fill="#553587" font-size="11" font-weight="700">COMPARATIVELY OPEN</text>
    </g>

    <g transform="translate(968 421)">
      <rect width="400" height="276" rx="10" fill="#f5fbf8" stroke="#19845d" stroke-width="2"/>
      <rect width="400" height="8" rx="4" fill="#19845d"/>
      <text x="22" y="42" fill="#19845d" font-size="12" font-weight="700" letter-spacing="1.6">U · PROXIMAL UPDATE</text>
      <text x="22" y="82" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="28">
        <tspan fill="#c66d0a">q</tspan><tspan fill="#59636e">  →  </tspan><tspan fill="#19845d">π</tspan><tspan baseline-shift="sub" font-size="16" fill="#19845d">θ</tspan>
        <tspan dx="15" fill="#59636e" font-size="21">U = </tspan><tspan fill="#19845d" font-size="21">π</tspan><tspan fill="#59636e" font-size="21">/</tspan><tspan fill="#c66d0a" font-size="21">q</tspan>
      </text>
      <text x="22" y="113" fill="#35404a" font-size="14">Current trainable policy near its anchor</text>
      <line x1="22" y1="132" x2="378" y2="132" stroke="#c5dfd5"/>
      <text x="22" y="160" fill="#59636e" font-size="12" font-weight="700" letter-spacing="1.2">OPERATOR</text>
      <text x="22" y="185" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">differentiable shaper</text>
      <text x="22" y="218" fill="#59636e" font-size="12" font-weight="700" letter-spacing="1.2">MAPPED METHODS</text>
      <text x="22" y="244" fill="#17202a" font-size="14">PPO · GSPO · DPPO · TRM</text>
      <rect x="264" y="223" width="114" height="31" rx="15.5" fill="#eaf6f1" stroke="#19845d"/>
      <text x="321" y="243" text-anchor="middle" fill="#126746" font-size="11" font-weight="700">DENSELY EXPLORED</text>
    </g>

    <!-- Bypass special case -->
    <g transform="translate(72 729)">
      <rect width="1296" height="67" rx="7" fill="#f8fafb" stroke="#aeb6bf" stroke-width="1.5"/>
      <text x="20" y="27" fill="#59636e" font-size="11" font-weight="700" letter-spacing="1.6">COUPLED BYPASS · SPECIAL CASE</text>
      <text x="20" y="51" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">
        <tspan fill="#c66d0a">q</tspan><tspan fill="#59636e"> = </tspan><tspan fill="#2878ad">μ</tspan>
        <tspan fill="#59636e">  ⇒  B = 1,   U = E = </tspan><tspan fill="#19845d">π</tspan><tspan fill="#59636e">/</tspan><tspan fill="#2878ad">μ</tspan>
      </text>
      <text x="1274" y="40" text-anchor="end" fill="#59636e" font-size="13">behavior correction and proximal control collapse onto the direct edge</text>
    </g>
  </g>
</svg>
