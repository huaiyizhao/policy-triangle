<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="intro-title intro-desc">
  <title id="intro-title">Policy-mismatch mitigation in asynchronous LLM reinforcement learning</title>
  <desc id="intro-desc">The behavior policy generates rollout data, the proximal policy provides behavior correction and an update anchor, and the current policy is optimized. Mitigation methods are located by edge, operator, and geometry.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2878ad"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c66d0a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#19845d"/>
    </marker>
  </defs>

  <rect width="1440" height="760" fill="#f6f8fa"/>
  <rect x="35" y="35" width="1370" height="690" rx="12" fill="#ffffff" stroke="#d8dde2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="82" fill="#59636e" font-size="15" font-weight="700" letter-spacing="2.7">CONCEPTUAL OVERVIEW</text>
    <text x="76" y="128" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="37">Policy-mismatch mitigation in asynchronous LLM reinforcement learning</text>
    <text x="76" y="162" fill="#59636e" font-size="18">Three policy roles separate data provenance, behavior correction, and proximal update control.</text>
    <line x1="76" y1="188" x2="1364" y2="188" stroke="#d8dde2" stroke-width="2"/>
  </g>

  <!-- Direct behavior-to-current edge -->
  <path d="M225 260 C420 197 1018 197 1215 260" fill="none" stroke="#19845d" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-green)"/>
  <g transform="translate(590 196)">
    <rect width="260" height="46" rx="5" fill="#eef8f4" stroke="#19845d" stroke-width="1.5"/>
    <text x="130" y="30" text-anchor="middle" fill="#126746" font-family="Georgia, 'Times New Roman', serif" font-size="23">E = π<tspan baseline-shift="sub" font-size="15">θ</tspan> / μ = B U</text>
  </g>
  <text x="720" y="258" text-anchor="middle" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="14">total behavior-to-current mismatch</text>

  <!-- Policy cards -->
  <g transform="translate(76 286)">
    <rect width="330" height="177" rx="9" fill="#f7fbfd" stroke="#2878ad" stroke-width="2.5"/>
    <rect width="330" height="9" rx="4.5" fill="#2878ad"/>
    <text x="24" y="43" fill="#2878ad" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">DATA PROVENANCE</text>
    <text x="24" y="82" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="29">Behavior policy μ</text>
    <text x="24" y="111" fill="#35404a" font-family="Arial, Helvetica, sans-serif" font-size="17">rollout distribution</text>
    <line x1="24" y1="129" x2="306" y2="129" stroke="#c8ddea"/>
    <text x="24" y="154" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="14">generated and logged the sampled tokens</text>
  </g>

  <g transform="translate(555 286)">
    <rect width="330" height="177" rx="9" fill="#fffaf4" stroke="#c66d0a" stroke-width="2.5"/>
    <rect width="330" height="9" rx="4.5" fill="#c66d0a"/>
    <text x="24" y="43" fill="#c66d0a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">LEARNER ADMISSION</text>
    <text x="24" y="82" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="29">Proximal policy q</text>
    <text x="24" y="111" fill="#35404a" font-family="Arial, Helvetica, sans-serif" font-size="17">frozen update anchor</text>
    <line x1="24" y1="129" x2="306" y2="129" stroke="#ecd6bc"/>
    <text x="24" y="154" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="14">defines the start of the current update</text>
  </g>

  <g transform="translate(1034 286)">
    <rect width="330" height="177" rx="9" fill="#f5fbf8" stroke="#19845d" stroke-width="2.5"/>
    <rect width="330" height="9" rx="4.5" fill="#19845d"/>
    <text x="24" y="43" fill="#19845d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">OPTIMIZATION</text>
    <text x="24" y="82" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="29">Current policy π<tspan baseline-shift="sub" font-size="19">θ</tspan></text>
    <text x="24" y="111" fill="#35404a" font-family="Arial, Helvetica, sans-serif" font-size="17">trainable distribution</text>
    <line x1="24" y1="129" x2="306" y2="129" stroke="#c5dfd5"/>
    <text x="24" y="154" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="14">receives the policy-gradient update</text>
  </g>

  <!-- Behavior correction -->
  <line x1="406" y1="374" x2="535" y2="374" stroke="#2878ad" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <g transform="translate(404 306)">
    <rect width="135" height="42" rx="5" fill="#ffffff" stroke="#2878ad" stroke-width="1.5"/>
    <text x="67.5" y="27" text-anchor="middle" fill="#205f8b" font-family="Georgia, 'Times New Roman', serif" font-size="21">B = q / μ</text>
  </g>
  <text x="472" y="410" text-anchor="middle" fill="#2878ad" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">BEHAVIOR CORRECTION</text>
  <text x="472" y="431" text-anchor="middle" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="11">detached weight or mask</text>

  <!-- Update control -->
  <line x1="885" y1="374" x2="1014" y2="374" stroke="#c66d0a" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <g transform="translate(883 306)">
    <rect width="135" height="42" rx="5" fill="#ffffff" stroke="#c66d0a" stroke-width="1.5"/>
    <text x="67.5" y="27" text-anchor="middle" fill="#8f4c05" font-family="Georgia, 'Times New Roman', serif" font-size="21">U = π<tspan baseline-shift="sub" font-size="14">θ</tspan> / q</text>
  </g>
  <text x="951" y="410" text-anchor="middle" fill="#c66d0a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">PROXIMAL CONTROL</text>
  <text x="951" y="431" text-anchor="middle" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="11">differentiable shaper</text>

  <!-- Solution-space coordinates -->
  <g transform="translate(76 510)">
    <rect width="1288" height="165" rx="8" fill="#f6f8fa" stroke="#d8dde2" stroke-width="1.5"/>
    <text x="22" y="33" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">MITIGATION SOLUTION SPACE</text>
    <line x1="22" y1="48" x2="1266" y2="48" stroke="#d8dde2"/>

    <g transform="translate(22 66)">
      <text x="0" y="18" fill="#2878ad" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">EDGE · WHERE?</text>
      <text x="0" y="50" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="20">B · U · E</text>
      <text x="0" y="76" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="13">mismatch source or attachment</text>
    </g>

    <line x1="380" y1="66" x2="380" y2="143" stroke="#d8dde2"/>
    <g transform="translate(412 66)">
      <text x="0" y="18" fill="#c66d0a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">OPERATOR · WHAT?</text>
      <text x="0" y="50" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="20">mask · weight · shaper</text>
      <text x="0" y="76" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="13">select · reweight · constrain</text>
    </g>

    <line x1="825" y1="66" x2="825" y2="143" stroke="#d8dde2"/>
    <g transform="translate(857 66)">
      <text x="0" y="18" fill="#19845d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">GEOMETRY · AT WHAT SCALE?</text>
      <text x="0" y="50" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="20">token · prefix · sequence · group</text>
      <text x="0" y="76" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="13">ratio, aggregation, or distributional statistic</text>
    </g>
  </g>
</svg>
