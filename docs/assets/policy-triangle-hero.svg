<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="triangle-title triangle-desc">
  <title id="triangle-title">The policy triangle as a ratio-placement aid</title>
  <desc id="triangle-desc">A compact academic diagram of behavior policy mu, proximal anchor q, and current policy pi. B equals q over mu, U equals pi over q, and E equals pi over mu and B times U. The right side lists natural estimator attachments and notes that credit and geometry are specified outside the triangle.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#d8dde2" opacity="0.52"/>
    </pattern>
    <marker id="tri-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2878ad"/>
    </marker>
    <marker id="tri-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#19845d"/>
    </marker>
    <marker id="tri-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6947a4"/>
    </marker>
  </defs>

  <rect width="1440" height="640" fill="#f7f8fa"/>
  <rect width="1440" height="640" fill="url(#dots)"/>
  <rect x="34" y="34" width="1372" height="572" rx="14" fill="#ffffff" stroke="#d8dde2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="78" fill="#59636e" font-size="13" font-weight="700" letter-spacing="2.3">AUXILIARY VIEW</text>
    <text x="72" y="116" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="31">The policy triangle answers one question: where is the ratio read?</text>
    <line x1="72" y1="140" x2="1368" y2="140" stroke="#d8dde2" stroke-width="2"/>

    <g transform="translate(70 164)">
      <rect width="795" height="361" rx="11" fill="#f8fafb" stroke="#d8dde2" stroke-width="1.5"/>

      <path d="M160 281 L601 281" fill="none" stroke="#2878ad" stroke-width="5" marker-end="url(#tri-blue)"/>
      <path d="M668 241 L461 82" fill="none" stroke="#19845d" stroke-width="5" marker-end="url(#tri-green)"/>
      <path d="M125 241 L349 82" fill="none" stroke="#6947a4" stroke-width="5" marker-end="url(#tri-purple)"/>

      <g transform="translate(40 238)">
        <rect width="180" height="88" rx="10" fill="#eef6fb" stroke="#2878ad" stroke-width="2.5"/>
        <circle cx="34" cy="44" r="22" fill="#2878ad"/>
        <text x="34" y="52" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="27">μ</text>
        <text x="70" y="38" fill="#17202a" font-size="18" font-weight="700">behavior</text>
        <text x="70" y="59" fill="#59636e" font-size="13">rollout source</text>
      </g>

      <g transform="translate(575 238)">
        <rect width="180" height="88" rx="10" fill="#fff7ee" stroke="#c66d0a" stroke-width="2.5"/>
        <circle cx="34" cy="44" r="22" fill="#c66d0a"/>
        <text x="34" y="52" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="27">q</text>
        <text x="70" y="38" fill="#17202a" font-size="18" font-weight="700">proximal</text>
        <text x="70" y="59" fill="#59636e" font-size="13">surrogate anchor</text>
      </g>

      <g transform="translate(307 22)">
        <rect width="180" height="88" rx="10" fill="#eef8f4" stroke="#19845d" stroke-width="2.5"/>
        <circle cx="34" cy="44" r="22" fill="#19845d"/>
        <text x="34" y="52" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="26">π</text>
        <text x="70" y="38" fill="#17202a" font-size="18" font-weight="700">current</text>
        <text x="70" y="59" fill="#59636e" font-size="13">trainable policy</text>
      </g>

      <rect x="292" y="250" width="210" height="62" rx="9" fill="#ffffff" stroke="#2878ad" stroke-width="1.5"/>
      <text x="397" y="275" text-anchor="middle" fill="#205f8b" font-family="Georgia, 'Times New Roman', serif" font-size="22">B = q / μ</text>
      <text x="397" y="297" text-anchor="middle" fill="#59636e" font-size="12">inherited data mismatch</text>

      <rect x="520" y="123" width="187" height="62" rx="9" fill="#ffffff" stroke="#19845d" stroke-width="1.5"/>
      <text x="613.5" y="148" text-anchor="middle" fill="#126746" font-family="Georgia, 'Times New Roman', serif" font-size="22">U = π / q</text>
      <text x="613.5" y="170" text-anchor="middle" fill="#59636e" font-size="12">trainable update</text>

      <rect x="100" y="123" width="220" height="62" rx="9" fill="#ffffff" stroke="#6947a4" stroke-width="1.5"/>
      <text x="210" y="148" text-anchor="middle" fill="#553587" font-family="Georgia, 'Times New Roman', serif" font-size="22">E = π / μ = BU</text>
      <text x="210" y="170" text-anchor="middle" fill="#59636e" font-size="12">collapsed endpoint mismatch</text>
    </g>

    <g transform="translate(899 164)">
      <rect width="469" height="361" rx="11" fill="#17202a"/>
      <text x="28" y="41" fill="#aeb9c3" font-size="12" font-weight="700" letter-spacing="2">NATURAL ESTIMATOR ATTACHMENTS</text>

      <g transform="translate(28 63)">
        <rect width="413" height="66" rx="8" fill="#223440" stroke="#40515d"/>
        <circle cx="34" cy="33" r="18" fill="#2878ad"/>
        <text x="34" y="40" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="21">B</text>
        <text x="69" y="28" fill="#ffffff" font-size="17" font-weight="700">static data-side choices</text>
        <text x="69" y="49" fill="#aeb9c3" font-size="13">S(B) · mask M · detached weight W</text>
      </g>

      <g transform="translate(28 143)">
        <rect width="413" height="66" rx="8" fill="#223440" stroke="#40515d"/>
        <circle cx="34" cy="33" r="18" fill="#19845d"/>
        <text x="34" y="40" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="21">U</text>
        <text x="69" y="28" fill="#ffffff" font-size="17" font-weight="700">dynamic update-side choice</text>
        <text x="69" y="49" fill="#aeb9c3" font-size="13">Ψ(U, Â) · PPO / GSPO shaping</text>
      </g>

      <g transform="translate(28 223)">
        <rect width="413" height="66" rx="8" fill="#223440" stroke="#40515d"/>
        <circle cx="34" cy="33" r="18" fill="#6947a4"/>
        <text x="34" y="40" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="21">E</text>
        <text x="69" y="28" fill="#ffffff" font-size="17" font-weight="700">coupled or endpoint choice</text>
        <text x="69" y="49" fill="#aeb9c3" font-size="13">natural when q = μ; otherwise conflates B and U</text>
      </g>

      <line x1="28" y1="309" x2="441" y2="309" stroke="#40515d"/>
      <text x="28" y="335" fill="#79c5aa" font-size="13" font-weight="700">OUTSIDE THE TRIANGLE</text>
      <text x="180" y="335" fill="#d5dde3" font-size="13">geometry · tail semantics · credit Â · normalization</text>
    </g>

    <g transform="translate(70 546)">
      <rect width="1298" height="36" rx="6" fill="#f8fafb" stroke="#aeb6bf"/>
      <text x="18" y="23" fill="#59636e" font-size="13">Coupled bypass: q = μ ⇒ B = 1 and U = E. With distinct q, nonlinear M(E) or C(E) is generally not equivalent to separate operations on B and U.</text>
    </g>
  </g>
</svg>
