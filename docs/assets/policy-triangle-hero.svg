<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">The policy triangle in LLM reinforcement learning</title>
  <desc id="hero-desc">A graphical abstract connecting the behavior, proximal, and current policies through the ratios B, U, and E equals B times U, with mask, weight, and clip operators.</desc>

  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#d7dde2" opacity="0.62"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2878ad"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c66d0a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#19845d"/>
    </marker>
  </defs>

  <rect width="1440" height="760" fill="#f7f8fa"/>
  <rect width="1440" height="760" fill="url(#dot-grid)"/>
  <rect x="36" y="36" width="1368" height="688" rx="18" fill="#ffffff" stroke="#d8dde2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="92" fill="#59636e" font-size="18" font-weight="700" letter-spacing="3">A UNIFIED SOLUTION SPACE FOR POLICY-MISMATCH MITIGATION</text>
    <line x1="82" y1="116" x2="1358" y2="116" stroke="#d8dde2" stroke-width="2"/>
  </g>

  <!-- Triangle field -->
  <g>
    <path d="M252 555 L630 555" fill="none" stroke="#2878ad" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <path d="M738 514 L588 278" fill="none" stroke="#c66d0a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <path d="M216 514 L471 275" fill="none" stroke="#19845d" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-green)"/>

    <g transform="translate(390 526)">
      <rect width="178" height="58" rx="29" fill="#eef6fb" stroke="#2878ad" stroke-width="2"/>
      <text x="89" y="37" text-anchor="middle" fill="#205f8b" font-family="Georgia, 'Times New Roman', serif" font-size="28">B = q / μ</text>
    </g>
    <g transform="translate(620 351)">
      <rect width="174" height="58" rx="29" fill="#fff7ee" stroke="#c66d0a" stroke-width="2"/>
      <text x="87" y="37" text-anchor="middle" fill="#8f4c05" font-family="Georgia, 'Times New Roman', serif" font-size="28">U = π / q</text>
    </g>
    <g transform="translate(207 350)">
      <rect width="236" height="58" rx="29" fill="#eef8f4" stroke="#19845d" stroke-width="2"/>
      <text x="118" y="37" text-anchor="middle" fill="#126746" font-family="Georgia, 'Times New Roman', serif" font-size="27">E = π / μ = BU</text>
    </g>

    <g transform="translate(90 520)">
      <rect width="230" height="126" rx="12" fill="#ffffff" stroke="#2878ad" stroke-width="3"/>
      <rect width="12" height="126" rx="6" fill="#2878ad"/>
      <text x="36" y="43" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="29">Behavior μ</text>
      <text x="36" y="73" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="17">generated the sample</text>
      <text x="36" y="101" fill="#2878ad" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">ROLLOUT</text>
    </g>
    <g transform="translate(650 520)">
      <rect width="230" height="126" rx="12" fill="#ffffff" stroke="#c66d0a" stroke-width="3"/>
      <rect x="218" width="12" height="126" rx="6" fill="#c66d0a"/>
      <text x="28" y="43" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="29">Proximal q</text>
      <text x="28" y="73" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="17">anchors the update</text>
      <text x="28" y="101" fill="#c66d0a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">FROZEN</text>
    </g>
    <g transform="translate(400 157)">
      <rect width="250" height="126" rx="12" fill="#ffffff" stroke="#19845d" stroke-width="3"/>
      <rect y="0" width="250" height="12" rx="6" fill="#19845d"/>
      <text x="125" y="54" text-anchor="middle" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="29">Current π</text>
      <text x="125" y="84" text-anchor="middle" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="17">receives the gradient</text>
      <text x="125" y="110" text-anchor="middle" fill="#19845d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">TRAINABLE</text>
    </g>
  </g>

  <!-- Explanatory rail -->
  <g transform="translate(944 157)">
    <rect width="414" height="489" rx="14" fill="#17202a"/>
    <text x="34" y="49" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">MITIGATION OPERATORS</text>
    <text x="34" y="82" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="27">What does a method do?</text>

    <g transform="translate(34 112)">
      <rect width="346" height="70" rx="9" fill="#223440" stroke="#40515d"/>
      <g transform="translate(18 17)">
        <rect width="36" height="36" rx="5" fill="none" stroke="#80b9de" stroke-width="2"/>
        <path d="M9 19 L16 26 L29 10" fill="none" stroke="#80b9de" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="72" y="31" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">mask</text>
      <text x="72" y="53" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="15">select data · detached</text>
    </g>

    <g transform="translate(34 196)">
      <rect width="346" height="70" rx="9" fill="#223440" stroke="#40515d"/>
      <g transform="translate(18 17)">
        <circle cx="18" cy="18" r="17" fill="none" stroke="#e5a960" stroke-width="2"/>
        <text x="18" y="24" text-anchor="middle" fill="#e5a960" font-family="Georgia, 'Times New Roman', serif" font-size="20">w</text>
      </g>
      <text x="72" y="31" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">weight</text>
      <text x="72" y="53" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="15">change measure · detached</text>
    </g>

    <g transform="translate(34 280)">
      <rect width="346" height="70" rx="9" fill="#223440" stroke="#40515d"/>
      <g transform="translate(18 17)">
        <path d="M2 30 C11 30 11 7 20 7 C29 7 29 30 36 30" fill="none" stroke="#79c5aa" stroke-width="3" stroke-linecap="round"/>
        <line x1="2" y1="35" x2="36" y2="35" stroke="#79c5aa" stroke-width="2"/>
      </g>
      <text x="72" y="31" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">clip</text>
      <text x="72" y="53" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="15">shape update · differentiable</text>
    </g>

    <line x1="34" y1="382" x2="380" y2="382" stroke="#40515d"/>
    <text x="34" y="416" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">GEOMETRY</text>
    <text x="34" y="453" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="23">token · sequence · group</text>
    <text x="34" y="479" fill="#79c5aa" font-family="Arial, Helvetica, sans-serif" font-size="15">chosen independently per attachment</text>
  </g>
</svg>
