<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 930" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">The policy triangle as an approximation space for a proximal-policy surrogate</title>
  <desc id="hero-desc">A graphical abstract connecting behavior, proximal, and current policies. The B edge corrects past data, the proximal vertex anchors the required advantage A q, and the U edge shapes the current update. Bypass sets q equal to mu so B equals one and U equals E. Representative cards place IS, rejection sampling, IcePop, and KPop in the edge, operator, geometry, and credit solution space.</desc>

  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#d7dde2" opacity="0.62"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2878ad"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c66d0a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#19845d"/>
    </marker>
  </defs>

  <rect width="1440" height="930" fill="#f7f8fa"/>
  <rect width="1440" height="930" fill="url(#dot-grid)"/>
  <rect x="36" y="36" width="1368" height="858" rx="18" fill="#ffffff" stroke="#d8dde2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="92" fill="#59636e" font-size="18" font-weight="700" letter-spacing="3">APPROXIMATING THE DECOUPLED q-SURROGATE</text>
    <line x1="82" y1="116" x2="1358" y2="116" stroke="#d8dde2" stroke-width="2"/>
  </g>

  <!-- Triangle field -->
  <g>
    <path d="M252 555 L630 555" fill="none" stroke="#2878ad" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <path d="M738 514 L588 278" fill="none" stroke="#c66d0a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <path d="M216 514 L471 275" fill="none" stroke="#19845d" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-green)"/>

    <g transform="translate(370 510)">
      <rect width="218" height="90" rx="18" fill="#eef6fb" stroke="#2878ad" stroke-width="2"/>
      <text x="109" y="27" text-anchor="middle" fill="#205f8b" font-family="Georgia, 'Times New Roman', serif" font-size="25">B = q / μ</text>
      <text x="109" y="44" text-anchor="middle" fill="#2878ad" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">PAST / DATA</text>
      <line x1="18" y1="51" x2="200" y2="51" stroke="#c7dce9"/>
      <rect x="24" y="58" width="78" height="24" rx="12" fill="#e5f2fa" stroke="#2878ad"/>
      <text x="63" y="75" text-anchor="middle" fill="#205f8b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">M · MASK</text>
      <rect x="116" y="58" width="78" height="24" rx="12" fill="#fff3e3" stroke="#c66d0a"/>
      <text x="155" y="75" text-anchor="middle" fill="#8f4c05" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">W · WEIGHT</text>
    </g>
    <g transform="translate(601 331)">
      <rect width="218" height="90" rx="18" fill="#fff7ee" stroke="#c66d0a" stroke-width="2"/>
      <text x="109" y="27" text-anchor="middle" fill="#8f4c05" font-family="Georgia, 'Times New Roman', serif" font-size="25">U = π / q</text>
      <text x="109" y="44" text-anchor="middle" fill="#c66d0a" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">PROXIMAL UPDATE</text>
      <line x1="18" y1="51" x2="200" y2="51" stroke="#ecd6bc"/>
      <rect x="58" y="58" width="102" height="24" rx="12" fill="#eaf6f1" stroke="#19845d"/>
      <text x="109" y="75" text-anchor="middle" fill="#126746" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">C · SHAPER</text>
    </g>
    <g transform="translate(168 323)">
      <rect width="300" height="104" rx="18" fill="#eef8f4" stroke="#19845d" stroke-width="2"/>
      <text x="150" y="27" text-anchor="middle" fill="#126746" font-family="Georgia, 'Times New Roman', serif" font-size="25">E = π / μ = BU</text>
      <text x="150" y="47" text-anchor="middle" fill="#19845d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">BYPASS: q = μ  ⇒  B = 1, U = E</text>
      <line x1="18" y1="57" x2="282" y2="57" stroke="#c9e1d8"/>
      <rect x="26" y="67" width="70" height="24" rx="12" fill="#e5f2fa" stroke="#2878ad"/>
      <text x="61" y="84" text-anchor="middle" fill="#205f8b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">M · MASK</text>
      <rect x="115" y="67" width="70" height="24" rx="12" fill="#fff3e3" stroke="#c66d0a"/>
      <text x="150" y="84" text-anchor="middle" fill="#8f4c05" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">W · WEIGHT</text>
      <rect x="204" y="67" width="70" height="24" rx="12" fill="#eaf6f1" stroke="#19845d"/>
      <text x="239" y="84" text-anchor="middle" fill="#126746" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">C · SHAPER</text>
    </g>

    <g transform="translate(90 520)">
      <rect width="230" height="126" rx="12" fill="#ffffff" stroke="#2878ad" stroke-width="3"/>
      <rect width="12" height="126" rx="6" fill="#2878ad"/>
      <text x="36" y="43" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="29">Behavior μ</text>
      <text x="36" y="73" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="16">sample + rollout credit</text>
      <text x="36" y="101" fill="#2878ad" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1">CREDIT · A<tspan baseline-shift="sub" font-size="10">roll</tspan></text>
    </g>
    <g transform="translate(650 520)">
      <rect width="230" height="126" rx="12" fill="#ffffff" stroke="#c66d0a" stroke-width="3"/>
      <rect x="218" width="12" height="126" rx="6" fill="#c66d0a"/>
      <text x="28" y="43" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="29">Proximal q</text>
      <text x="28" y="73" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="16">anchors local surrogate</text>
      <text x="28" y="101" fill="#c66d0a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1">REQUIRED CREDIT · A<tspan baseline-shift="super" font-size="10">q</tspan></text>
    </g>

    <path d="M325 660 L642 660" fill="none" stroke="#2878ad" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>
    <rect x="367" y="646" width="230" height="28" rx="14" fill="#ffffff" stroke="#2878ad"/>
    <text x="482" y="665" text-anchor="middle" fill="#205f8b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">CREDIT REALIGNMENT · A<tspan baseline-shift="sub" font-size="9">roll</tspan><tspan baseline-shift="baseline" font-size="12"> → A</tspan><tspan baseline-shift="super" font-size="9">q</tspan></text>
    <g transform="translate(400 157)">
      <rect width="250" height="126" rx="12" fill="#ffffff" stroke="#19845d" stroke-width="3"/>
      <rect y="0" width="250" height="12" rx="6" fill="#19845d"/>
      <text x="125" y="54" text-anchor="middle" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="29">Current π</text>
      <text x="125" y="84" text-anchor="middle" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="17">receives the gradient</text>
      <text x="125" y="110" text-anchor="middle" fill="#19845d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">TRAINABLE</text>
    </g>
  </g>

  <!-- Explanatory rail -->
  <g transform="translate(944 157)">
    <rect width="414" height="489" rx="14" fill="#17202a"/>
    <text x="34" y="49" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">MITIGATION OPERATORS</text>
    <text x="34" y="82" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="27">What does a method do?</text>

    <g transform="translate(34 112)">
      <rect width="346" height="70" rx="9" fill="#223440" stroke="#40515d"/>
      <g transform="translate(18 17)">
        <rect width="36" height="36" rx="5" fill="none" stroke="#80b9de" stroke-width="2"/>
        <path d="M9 19 L16 26 L29 10" fill="none" stroke="#80b9de" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="72" y="31" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">mask</text>
      <text x="72" y="53" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="15">select data · detached</text>
    </g>

    <g transform="translate(34 196)">
      <rect width="346" height="70" rx="9" fill="#223440" stroke="#40515d"/>
      <g transform="translate(18 17)">
        <circle cx="18" cy="18" r="17" fill="none" stroke="#e5a960" stroke-width="2"/>
        <text x="18" y="24" text-anchor="middle" fill="#e5a960" font-family="Georgia, 'Times New Roman', serif" font-size="20">w</text>
      </g>
      <text x="72" y="31" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">weight</text>
      <text x="72" y="53" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="15">change measure · detached</text>
    </g>

    <g transform="translate(34 280)">
      <rect width="346" height="70" rx="9" fill="#223440" stroke="#40515d"/>
      <g transform="translate(18 17)">
        <path d="M2 30 C11 30 11 7 20 7 C29 7 29 30 36 30" fill="none" stroke="#79c5aa" stroke-width="3" stroke-linecap="round"/>
        <line x1="2" y1="35" x2="36" y2="35" stroke="#79c5aa" stroke-width="2"/>
      </g>
      <text x="72" y="28" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">shaper</text>
      <text x="72" y="49" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="14">shape update · differentiable</text>
      <text x="72" y="64" fill="#79c5aa" font-family="Arial, Helvetica, sans-serif" font-size="11">clip · smooth · divergence</text>
    </g>

    <line x1="34" y1="382" x2="380" y2="382" stroke="#40515d"/>
    <text x="34" y="416" fill="#aeb9c3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">GEOMETRY + CREDIT LABEL</text>
    <text x="34" y="453" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="23">token · sequence · group</text>
    <text x="34" y="479" fill="#79c5aa" font-family="Arial, Helvetica, sans-serif" font-size="15">credit · rollout / μ / q / π</text>
  </g>

  <!-- Representative method coordinates -->
  <g transform="translate(82 682)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1276" height="184" rx="12" fill="#f6f8fa" stroke="#d8dde2" stroke-width="1.5"/>
    <text x="22" y="31" fill="#59636e" font-size="14" font-weight="700" letter-spacing="2">REPRESENTATIVE COORDINATES FROM §2.5 · EDGE × OPERATOR × GEOMETRY × CREDIT</text>

    <g transform="translate(22 49)">
      <rect width="286" height="108" rx="8" fill="#fff9f2" stroke="#c66d0a" stroke-width="2"/>
      <text x="18" y="28" fill="#c66d0a" font-size="15" font-weight="700" letter-spacing="1.5">IS</text>
      <text x="18" y="54" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="18">B or E · weight</text>
      <text x="18" y="77" fill="#35404a" font-size="14">token / prefix / sequence</text>
      <text x="18" y="97" fill="#59636e" font-size="12">credit must match the ratio horizon</text>
    </g>

    <g transform="translate(330 49)">
      <rect width="286" height="108" rx="8" fill="#f4f9fc" stroke="#2878ad" stroke-width="2"/>
      <text x="18" y="28" fill="#2878ad" font-size="15" font-weight="700" letter-spacing="1.5">RS</text>
      <text x="18" y="54" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="18">B or E · mask</text>
      <text x="18" y="77" fill="#35404a" font-size="14">token / sequence / geometric</text>
      <text x="18" y="97" fill="#59636e" font-size="12">selection · credit handled separately</text>
    </g>

    <g transform="translate(638 49)">
      <rect width="286" height="108" rx="8" fill="#f8f5fc" stroke="#6947a4" stroke-width="2"/>
      <text x="18" y="28" fill="#6947a4" font-size="15" font-weight="700" letter-spacing="1.5">ICEPOP</text>
      <text x="18" y="53" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="17">B · ratio mask × raw weight</text>
      <text x="18" y="76" fill="#35404a" font-size="14">token mask · PPO shaper on U</text>
      <text x="18" y="97" fill="#6947a4" font-size="12" font-weight="700">credit: rollout ≈ A<tspan baseline-shift="super" font-size="9">q</tspan></text>
    </g>

    <g transform="translate(946 49)">
      <rect width="286" height="108" rx="8" fill="#fcf5f5" stroke="#a53f3f" stroke-width="2"/>
      <text x="18" y="28" fill="#a53f3f" font-size="15" font-weight="700" letter-spacing="1.5">KPOP</text>
      <text x="18" y="53" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="17">B · bKL mask × raw weight</text>
      <text x="18" y="76" fill="#35404a" font-size="14">token mask · PPO shaper on U</text>
      <text x="18" y="97" fill="#a53f3f" font-size="12" font-weight="700">credit: rollout ≈ A<tspan baseline-shift="super" font-size="9">q</tspan></text>
    </g>

    <text x="1254" y="174" text-anchor="end" fill="#7b858f" font-size="11">Methods may occupy multiple attachments.</text>
  </g>
</svg>
