<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Decision flow for configuring the unified estimator</title>
  <desc id="flow-desc">An academic flowchart. Fix the q-surrogate and credit target, choose coupled or factorized topology, fail fast when the proximal anchor, behavior support, or credit is invalid, configure behavior-side geometry and tail treatment, then shape the update and monitor estimator diagnostics.</desc>

  <defs>
    <pattern id="flow-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#d8dde2" opacity="0.45"/>
    </pattern>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#68747f"/>
    </marker>
    <marker id="flow-arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a53f3f"/>
    </marker>
  </defs>

  <rect width="1440" height="1120" fill="#f7f8fa"/>
  <rect width="1440" height="1120" fill="url(#flow-grid)"/>
  <rect x="34" y="34" width="1372" height="1052" rx="14" fill="#ffffff" stroke="#d8dde2" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="78" fill="#59636e" font-size="13" font-weight="700" letter-spacing="2.3">FROM REFERENCE TARGET TO ESTIMATOR CONFIGURATION</text>
    <text x="72" y="116" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="31">A practical decision flow</text>
    <text x="1368" y="113" text-anchor="end" fill="#7b858f" font-size="13">invalid assumptions require new data or a new anchor—not a stronger tail operator</text>
    <line x1="72" y1="140" x2="1368" y2="140" stroke="#d8dde2" stroke-width="2"/>

    <g transform="translate(430 164)">
      <rect width="580" height="76" rx="10" fill="#f8f5fc" stroke="#6947a4" stroke-width="2.5"/>
      <circle cx="42" cy="38" r="24" fill="#6947a4"/>
      <text x="42" y="46" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">1</text>
      <text x="82" y="31" fill="#553587" font-size="13" font-weight="700" letter-spacing="1.4">FIX THE REFERENCE</text>
      <text x="82" y="56" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="20">local q-surrogate · declared credit target A<tspan baseline-shift="super" font-size="13">q</tspan></text>
    </g>

    <line x1="720" y1="240" x2="720" y2="270" stroke="#68747f" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
    <path d="M720 273 L858 338 L720 403 L582 338 Z" fill="#f8fafb" stroke="#59636e" stroke-width="2.5"/>
    <text x="720" y="329" text-anchor="middle" fill="#59636e" font-size="12" font-weight="700" letter-spacing="1.4">TOPOLOGY</text>
    <text x="720" y="357" text-anchor="middle" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="25">q = μ ?</text>

    <path d="M582 338 H325 V385" fill="none" stroke="#68747f" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
    <rect x="440" y="322" width="54" height="25" rx="12.5" fill="#ffffff"/>
    <text x="467" y="340" text-anchor="middle" fill="#59636e" font-size="12" font-weight="700">YES</text>
    <path d="M858 338 H1115 V385" fill="none" stroke="#68747f" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
    <rect x="946" y="322" width="50" height="25" rx="12.5" fill="#ffffff"/>
    <text x="971" y="340" text-anchor="middle" fill="#59636e" font-size="12" font-weight="700">NO</text>

    <g transform="translate(80 385)">
      <rect width="490" height="150" rx="11" fill="#f4faf7" stroke="#19845d" stroke-width="2.5"/>
      <rect width="490" height="8" rx="4" fill="#19845d"/>
      <text x="22" y="39" fill="#19845d" font-size="13" font-weight="700" letter-spacing="1.4">COUPLED / BYPASS</text>
      <text x="22" y="72" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="25">B = 1,   U = E = π / μ</text>
      <text x="22" y="101" fill="#35404a" font-size="15">Base: Ψ̃<tspan baseline-shift="sub" font-size="10">PPO/GRPO</tspan>(E, Â<tspan baseline-shift="sub" font-size="10">roll</tspan>)</text>
      <rect x="22" y="116" width="446" height="25" rx="12.5" fill="#eaf6f1" stroke="#8ec6b1"/>
      <text x="245" y="133" text-anchor="middle" fill="#126746" font-size="12">Optional M(S(E)) only for an explicit anomaly gate</text>
    </g>

    <g transform="translate(870 385)">
      <rect width="490" height="150" rx="11" fill="#f4f9fc" stroke="#2878ad" stroke-width="2.5"/>
      <rect width="490" height="8" rx="4" fill="#2878ad"/>
      <text x="22" y="39" fill="#2878ad" font-size="13" font-weight="700" letter-spacing="1.4">FACTORIZED / DECOUPLED</text>
      <text x="22" y="72" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="24">B = q / μ,   U = π / q</text>
      <text x="22" y="101" fill="#35404a" font-size="15">Configure inherited data on B</text>
      <text x="22" y="127" fill="#35404a" font-size="15">Shape the trainable update on U</text>
    </g>

    <line x1="1115" y1="535" x2="1115" y2="575" stroke="#68747f" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

    <g transform="translate(870 575)">
      <rect width="490" height="136" rx="11" fill="#fffaf4" stroke="#c66d0a" stroke-width="2.5"/>
      <text x="22" y="31" fill="#c66d0a" font-size="13" font-weight="700" letter-spacing="1.4">2 · VALIDITY GATE</text>
      <line x1="22" y1="42" x2="468" y2="42" stroke="#ecd6bc"/>
      <circle cx="36" cy="66" r="9" fill="#c66d0a"/>
      <path d="M31 66 L35 70 L42 61" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="71" fill="#17202a" font-size="14">π remains near the proximal anchor q</text>
      <circle cx="36" cy="94" r="9" fill="#c66d0a"/>
      <path d="M31 94 L35 98 L42 89" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="99" fill="#17202a" font-size="14">behavior μ covers the required q support</text>
      <circle cx="36" cy="122" r="9" fill="#c66d0a"/>
      <path d="M31 122 L35 126 L42 117" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="127" fill="#17202a" font-size="14">credit Â is a credible proxy for A<tspan baseline-shift="super" font-size="10">q</tspan></text>
    </g>

    <path d="M870 643 H570" fill="none" stroke="#a53f3f" stroke-width="2.5" marker-end="url(#flow-arrow-red)"/>
    <rect x="690" y="626" width="72" height="25" rx="12.5" fill="#ffffff"/>
    <text x="726" y="644" text-anchor="middle" fill="#a53f3f" font-size="12" font-weight="700">ANY FAIL</text>

    <g transform="translate(80 575)">
      <rect width="490" height="136" rx="11" fill="#fcf5f5" stroke="#a53f3f" stroke-width="2.5"/>
      <text x="22" y="31" fill="#a53f3f" font-size="13" font-weight="700" letter-spacing="1.4">STOP TUNING OPERATORS</text>
      <line x1="22" y1="42" x2="468" y2="42" stroke="#ead0d0"/>
      <text x="22" y="70" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">refresh q · collect new rollouts</text>
      <text x="22" y="98" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="19">reduce optimization · realign Â → A<tspan baseline-shift="super" font-size="12">q</tspan></text>
      <text x="22" y="123" fill="#7d3434" font-size="12">TIS, MIS, or RS cannot repair a failed assumption.</text>
    </g>

    <line x1="1115" y1="711" x2="1115" y2="748" stroke="#68747f" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
    <rect x="1129" y="719" width="54" height="24" rx="12" fill="#ffffff"/>
    <text x="1156" y="736" text-anchor="middle" fill="#59636e" font-size="12" font-weight="700">PASS</text>

    <g transform="translate(650 748)">
      <rect width="710" height="196" rx="11" fill="#f8fafb" stroke="#2878ad" stroke-width="2.5"/>
      <text x="22" y="32" fill="#2878ad" font-size="13" font-weight="700" letter-spacing="1.4">3 · CONFIGURE THE BEHAVIOR SIDE B</text>
      <line x1="22" y1="44" x2="688" y2="44" stroke="#c7dce9"/>
      <text x="22" y="69" fill="#59636e" font-size="11" font-weight="700" letter-spacing="1.2">SHORTEST JUSTIFIED HORIZON</text>
      <rect x="22" y="82" width="208" height="38" rx="7" fill="#ffffff" stroke="#5578a7"/>
      <text x="126" y="99" text-anchor="middle" fill="#17202a" font-size="13" font-weight="700">PREFIX · with A<tspan baseline-shift="super" font-size="9">q</tspan></text>
      <text x="126" y="114" text-anchor="middle" fill="#59636e" font-size="10">causal reference contribution</text>
      <rect x="250" y="82" width="208" height="38" rx="7" fill="#ffffff" stroke="#c66d0a"/>
      <text x="354" y="99" text-anchor="middle" fill="#17202a" font-size="13" font-weight="700">SEQUENCE · response F</text>
      <text x="354" y="114" text-anchor="middle" fill="#59636e" font-size="10">general full-response correction</text>
      <rect x="478" y="82" width="208" height="38" rx="7" fill="#ffffff" stroke="#2878ad"/>
      <text x="582" y="99" text-anchor="middle" fill="#17202a" font-size="13" font-weight="700">TOKEN · approximation</text>
      <text x="582" y="114" text-anchor="middle" fill="#59636e" font-size="10">lower variance; occupancy bias</text>
      <text x="22" y="146" fill="#59636e" font-size="11" font-weight="700" letter-spacing="1.2">CLASSIFY THE TAIL</text>
      <rect x="22" y="158" width="208" height="27" rx="13.5" fill="#eef6fb" stroke="#2878ad"/>
      <text x="126" y="176" text-anchor="middle" fill="#205f8b" font-size="11" font-weight="700">ESS OK → RAW IS</text>
      <rect x="250" y="158" width="208" height="27" rx="13.5" fill="#fff3e3" stroke="#c66d0a"/>
      <text x="354" y="176" text-anchor="middle" fill="#8f4c05" font-size="11" font-weight="700">VALID HEAVY TAIL → TIS</text>
      <rect x="478" y="158" width="208" height="27" rx="13.5" fill="#fcf5f5" stroke="#a53f3f"/>
      <text x="582" y="176" text-anchor="middle" fill="#7d3434" font-size="11" font-weight="700">UNTRUSTED → MASK / RS</text>
    </g>

    <path d="M570 460 H610 V1011 H430" fill="none" stroke="#68747f" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
    <path d="M1005 944 V968" fill="none" stroke="#68747f" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

    <g transform="translate(430 968)">
      <rect width="580" height="86" rx="11" fill="#f4faf7" stroke="#19845d" stroke-width="2.5"/>
      <circle cx="43" cy="43" r="24" fill="#19845d"/>
      <text x="43" y="51" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">4</text>
      <text x="84" y="34" fill="#19845d" font-size="13" font-weight="700" letter-spacing="1.4">SHAPE THE TRAINABLE MOVE</text>
      <text x="84" y="62" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="20">Ψ̃<tspan baseline-shift="sub" font-size="12">PPO/GSPO</tspan>(U, Â) · use E when q = μ</text>
    </g>

    <g transform="translate(1040 968)">
      <rect width="320" height="86" rx="11" fill="#17202a"/>
      <text x="18" y="27" fill="#aeb9c3" font-size="11" font-weight="700" letter-spacing="1.3">MONITOR</text>
      <text x="18" y="50" fill="#ffffff" font-size="13">ESS · accept · clip · log B / log U</text>
      <text x="18" y="70" fill="#79c5aa" font-size="12">length · policy age · gate ↔ advantage</text>
    </g>
  </g>
</svg>
