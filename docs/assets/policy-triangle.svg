<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Policy triangle</title>
  <desc id="desc">Behavior, proximal, and current policies connected by ratios B, U, and E equals B times U.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2878ad"/>
    </marker>
    <marker id="au" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c66d0a"/>
    </marker>
    <marker id="ae" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#19845d"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#fff"/>
  <line x1="235" y1="390" x2="665" y2="390" stroke="#2878ad" stroke-width="4" marker-end="url(#ab)"/>
  <line x1="690" y1="355" x2="490" y2="150" stroke="#c66d0a" stroke-width="4" marker-end="url(#au)"/>
  <line x1="210" y1="355" x2="410" y2="150" stroke="#19845d" stroke-width="4" marker-end="url(#ae)"/>

  <g transform="translate(450 390)">
    <rect x="-65" y="-22" width="130" height="44" rx="5" fill="#fff" stroke="#2878ad"/>
    <text x="0" y="7" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#205f8b">B = q / μ</text>
  </g>
  <g transform="translate(600 250)">
    <rect x="-60" y="-22" width="120" height="44" rx="5" fill="#fff" stroke="#c66d0a"/>
    <text x="0" y="7" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#8f4c05">U = π / q</text>
  </g>
  <g transform="translate(290 250)">
    <rect x="-82" y="-22" width="164" height="44" rx="5" fill="#fff" stroke="#19845d"/>
    <text x="0" y="7" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#126746">E = π / μ = BU</text>
  </g>

  <g transform="translate(90 365)">
    <rect width="190" height="64" rx="6" fill="#fff" stroke="#2878ad" stroke-width="2"/>
    <circle cx="22" cy="32" r="6" fill="#2878ad"/>
    <text x="38" y="29" font-family="Georgia,serif" font-size="19" fill="#17202a">Behavior policy μ</text>
    <text x="38" y="49" font-family="Arial,sans-serif" font-size="14" fill="#59636e">rollout engine</text>
  </g>
  <g transform="translate(620 365)">
    <rect width="190" height="64" rx="6" fill="#fff" stroke="#c66d0a" stroke-width="2"/>
    <circle cx="22" cy="32" r="6" fill="#c66d0a"/>
    <text x="38" y="29" font-family="Georgia,serif" font-size="19" fill="#17202a">Proximal policy q</text>
    <text x="38" y="49" font-family="Arial,sans-serif" font-size="14" fill="#59636e">frozen update anchor</text>
  </g>
  <g transform="translate(355 75)">
    <rect width="190" height="64" rx="6" fill="#fff" stroke="#19845d" stroke-width="2"/>
    <circle cx="22" cy="32" r="6" fill="#19845d"/>
    <text x="38" y="29" font-family="Georgia,serif" font-size="19" fill="#17202a">Current policy π</text>
    <text x="38" y="49" font-family="Arial,sans-serif" font-size="14" fill="#59636e">trainable parameters</text>
  </g>
</svg>

